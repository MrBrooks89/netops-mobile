name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The ios job can be run on demand (it is the slow one).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Availability must stay data: no Platform.OS outside src/platform/** (M8).
      - name: Platform-leak check
        run: pnpm check:platform

      - name: Format check
        run: pnpm format:check

      - name: Unit tests + core coverage thresholds
        run: pnpm test:coverage --ci

  # M8: the only place an iOS build can be compiled and launched, since the
  # project has no macOS hardware. Runner is free because this repo is public.
  ios:
    # Xcode 26: expo-modules-jsi's Package.swift declares swift-tools-version
    # 6.2, so Xcode 16's Swift 6.1 cannot resolve it (found by this job).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the newest Xcode and report toolchain versions
        run: |
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | tail -5

      # Fail here, with a readable message, rather than inside a pod script.
      - name: Require Swift 6.2 or newer
        run: |
          swift --version
          swift --version | grep -qE "Swift version 6\.([2-9]|[1-9][0-9])" \
            || { echo "::error::expo-modules-jsi needs swift-tools-version 6.2 (Xcode 26+); this runner has an older Swift."; exit 1; }

      # CNG: ios/ is generated, never committed (ADR-001).
      - name: Prebuild the iOS project
        run: npx expo prebuild -p ios --no-install

      # The workspace, scheme and app names all follow app.json's slug, so they
      # are read from the generated project rather than written out here — a
      # rename in app.json must not need a CI edit.
      - name: Resolve generated project names
        id: ios
        run: |
          # The .xcodeproj exists right after prebuild; the workspace only
          # appears once CocoaPods has run, so its path is constructed from the
          # same name rather than listed here.
          project="$(ls -d ios/*.xcodeproj | head -1)"
          scheme="$(basename "$project" .xcodeproj)"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "workspace=ios/$scheme.xcworkspace" >> "$GITHUB_OUTPUT"
          echo "Using scheme $scheme (workspace ios/$scheme.xcworkspace)"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-macos26-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-macos26-

      - name: Install pods
        run: pod install --project-directory=ios

      - name: Check the generated iOS declarations
        run: node scripts/check-ios-plist.mjs "$(ls -d ios/*/Info.plist | head -1)"

      # Release so the JS bundle is embedded: the smoke test then needs no Metro.
      - name: Build for the simulator
        run: |
          xcodebuild \
            -workspace ${{ steps.ios.outputs.workspace }} \
            -scheme ${{ steps.ios.outputs.scheme }} \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check the built app's declarations
        run: |
          node scripts/check-ios-plist.mjs \
            "ios/build/Build/Products/Release-iphonesimulator/${{ steps.ios.outputs.scheme }}.app/Info.plist"

      - name: Boot, launch and screenshot the app
        run: scripts/ios-smoke.sh

      - name: Upload the smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: artifacts/ios
          if-no-files-found: warn
          retention-days: 14
