name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Availability must stay data: no Platform.OS outside src/platform/** (M8).
      - name: Platform-leak check
        run: pnpm check:platform

      - name: Format check
        run: pnpm format:check

      - name: Unit tests + core coverage thresholds
        run: pnpm test:coverage --ci
